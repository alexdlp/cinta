name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check

  test:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest

  integration:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Homebrew updates itself first on purpose: the runner image ships an old
      # catalogue, from before whisper-cpp was renamed whisper.cpp, and CI should
      # install what a user would.
      - run: brew install ffmpeg whisper.cpp yt-dlp
      # The same 3 GB of models a user downloads, fetched once and then restored.
      # The key names the two pinned files: change it when core/models.py does.
      - uses: actions/cache@v6
        with:
          path: ~/cinta/models
          key: models-ggml-large-v3-silero-v5.1.2
      - run: uv sync --locked
      - run: uv run pytest -m integration -v

  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: swift test --package-path swift/cintarec
      - run: swift build -c release --package-path swift/cintarec
      # --version needs no TCC permission, so it is the one thing a runner can
      # execute: it proves the binary links and starts.
      - run: swift/cintarec/.build/release/cintarec --version
