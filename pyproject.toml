[project]
name = "cinta"
version = "0.1.0"
description = "Record, download and transcribe audio and video from the command line"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "alexdlp", email = "alexdlp.dlp@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cinta = "cinta.cli:main"

# flit_core has no transitive dependencies, which is what keeps the Homebrew
# formula down to a single resource (DESIGN.md 6.2).
[build-system]
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[tool.uv]
# uv-managed interpreters only: neither miniconda nor brew gets picked up (6.6).
python-preference = "only-managed"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The fast loop is the default; the other two are asked for by name, and a -m
# on the command line replaces this one.
addopts = "-m 'not integration and not recording'"
markers = [
    "integration: real ffmpeg, whisper-cli, yt-dlp and models; pytest -m integration",
    "recording: records the screen, needs the TCC permission; pytest -m recording",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
